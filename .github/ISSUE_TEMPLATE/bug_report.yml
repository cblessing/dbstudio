name: Bug Report
description: Report a bug or unexpected behavior in Database Studio
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Connect to...
        2. Run query...
        3. Click...
    validations:
      required: true
  - type: dropdown
    id: database
    attributes:
      label: Database Engine
      options:
        - PostgreSQL
        - MySQL
        - MariaDB
        - Microsoft SQL Server
        - Oracle
        - ClickHouse
        - MongoDB
        - Redis
        - DuckDB
        - SQLite
        - Other / N/A
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: VS Code version, Database Studio version, and OS (including WSL / Remote-SSH / Dev Container if applicable).
      placeholder: "VS Code 1.98, Database Studio 1.1.0, Windows 11 + WSL2 Ubuntu"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error Messages or Screenshots
      description: Paste any error messages or logs (redact any credentials or hostnames).
